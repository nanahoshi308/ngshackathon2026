<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        ながさきごみナビ
    </title>

    <link rel="icon" href="img/icon.ico">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/calendar.css">

</head>


<body>


    <!-- ===========================
         ヘッダー
    ============================ -->

    <header class="header">

        <a href="main.html" class="header-logo">
            <img src="img/icon.ico" class="emoji-icon">ながさきごみナビ
        </a>


        <div class="selected-city">

            <span id="city-name">
                読み込み中...
            </span>

            <span id="area-name" class="selected-area"></span>

            <a href="index.html?change=true">
                変更
            </a>

        </div>

    </header>


    <!-- ===========================
         ナビゲーション
    ============================ -->

    <nav class="navigation">

        <a href="search.html" class="nav-item">
            <span>🔍</span>
            <span>検索</span>
        </a>


        <a href="calendar.html" class="nav-item">
            <span>📅</span>
            <span>カレンダー</span>
        </a>


        <a href="location.html" class="nav-item">
            <span>📍</span>
            <span>指定場所</span>
        </a>


        <a href="about.html" class="nav-item">
            <span>ℹ️</span>
            <span>概要</span>
        </a>

    </nav>


    <!-- ===========================
         メイン
    ============================ -->

    <main class="calendar-container">


        <!-- ===========================
     カレンダータイトル
============================ -->

        <div class="calendar-title-row">

            <h1 class="calendar-title">
                ごみ収集カレンダー
                <span id="calendar-area-name"></span>
            </h1>


            <!-- 通知設定ボタン -->

            <button type="button" id="notification-button" class="notification-button" aria-label="通知設定">
                🔔
            </button>


            <!-- ===========================
         通知設定ポップアップ
    ============================ -->

            <div id="notification-popup" class="notification-popup">

                <div class="notification-popup-title">

                    <span>
                        🔔 ごみ通知設定
                    </span>

                    <button type="button" id="notification-close" class="notification-close" aria-label="閉じる">
                        ×
                    </button>

                </div>


                <!-- ===========================
             タブ
        ============================ -->

                <div class="notification-tabs">

                    <button type="button" class="notification-tab active" data-tab="previous">
                        前日
                    </button>

                    <button type="button" class="notification-tab" data-tab="today">
                        当日
                    </button>

                </div>


                <!-- ===========================
             通知設定
        ============================ -->

                <div class="notification-settings">


                    <!-- 通知ON/OFF -->

                    <div class="notification-setting-row">

                        <span class="notification-setting-label">
                            通知
                        </span>


                        <label class="notification-switch">

                            <input type="checkbox" id="notification-enabled">

                            <span class="notification-slider"></span>

                        </label>

                    </div>


                    <!-- 時間 -->

                    <div class="notification-time-title">
                        通知時刻
                    </div>


                    <div class="notification-time-picker">


                        <!-- 時 -->

                        <div class="notification-time-column">

                            <div id="notification-hour-picker" class="notification-time-scroll">
                            </div>

                        </div>


                        <div class="notification-time-colon">
                            :
                        </div>


                        <!-- 分 -->

                        <div class="notification-time-column">

                            <div id="notification-minute-picker" class="notification-time-scroll">
                            </div>

                        </div>

                    </div>


                    <div class="notification-time-selected">

                        <span>
                            設定時刻：
                        </span>

                        <strong id="notification-selected-time">
                            07:00
                        </strong>

                    </div>


                </div>

            </div>

        </div>


        <!-- ===========================
             月移動
        ============================ -->

        <div class="month-navigation">

            <button type="button" id="previous-month">
                ← 前の月
            </button>


            <h2 id="month-title">
                読み込み中...
            </h2>


            <button type="button" id="next-month">
                次の月 →
            </button>

        </div>


        <!-- ===========================
             カレンダー
        ============================ -->

        <div class="calendar-card">


            <!-- 曜日 -->

            <div class="calendar-week">

                <div>
                    日
                </div>

                <div>
                    月
                </div>

                <div>
                    火
                </div>

                <div>
                    水
                </div>

                <div>
                    木
                </div>

                <div>
                    金
                </div>

                <div>
                    土
                </div>

            </div>


            <!-- 日付 -->

            <div id="calendar-days" class="calendar-days">
            </div>


        </div>

        <!-- ===========================
             カレンダーに追加した
             指定場所
        ============================ -->

        <section class="location-information">

            <h2>
                カレンダーに追加した指定場所
            </h2>


            <div id="calendar-location-list" class="calendar-location-list">
            </div>

        </section>


        <!-- ===========================
             ごみ情報
        ============================ -->

        <section class="garbage-information">

            <h2>
                ごみ情報
            </h2>


            <div id="garbage-list" class="garbage-list">
            </div>

        </section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/calendar.js"></script>


</body>

</html>
