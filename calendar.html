<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        ながさきごみナビ
    </title>

    <link rel="icon" href="img/icon.ico">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/calendar.css">

</head>


<body>


    <!-- ===========================
         ヘッダー
    ============================ -->

    <header class="header">

        <a href="main.html" class="header-logo">
            <img src="img/icon.ico" class="emoji-icon">ながさきごみナビ
        </a>


        <div class="selected-city">

            <span id="city-name">
                読み込み中...
            </span>

            <span id="area-name" class="selected-area"></span>

            <a href="index.html?change=true">
                変更
            </a>

        </div>

    </header>


    <!-- ===========================
         ナビゲーション
    ============================ -->

    <nav class="navigation">

        <a href="search.html" class="nav-item">
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="currentColor" fill-opacity=".18"/><path d="M15.5 15.5 20.5 20.5"/></svg></span>
            <span>検索</span>
        </a>


        <a href="calendar.html" class="nav-item">
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5V10h-17z" fill="currentColor" fill-opacity=".18" stroke="none"/><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.6"/></svg></span>
            <span>カレンダー</span>
        </a>


        <a href="location.html" class="nav-item">
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span>指定場所</span>
        </a>


        <a href="about.html" class="nav-item">
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity=".18"/><path d="M12 11v5.5"/><path d="M12 7.5h.01" stroke-width="2.6"/></svg></span>
            <span>概要</span>
        </a>

    </nav>


    <!-- ===========================
         メイン
    ============================ -->

    <main class="calendar-container">


        <!-- ===========================
     カレンダータイトル
============================ -->

        <div class="calendar-title-row">

            <h1 class="calendar-title">
                ごみ収集カレンダー
                <span id="calendar-area-name"></span>
            </h1>


            <!-- 通知設定ボタン -->

            <button type="button" id="notification-button" class="notification-button" aria-label="通知設定">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z" fill="currentColor" fill-opacity=".18"/><path d="M12 3v2M10 20.5a2 2 0 0 0 4 0"/></svg>
            </button>


            <!-- ===========================
         通知設定ポップアップ
    ============================ -->

            <div id="notification-popup" class="notification-popup">

                <div class="notification-popup-title">

                    <span>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z" fill="currentColor" fill-opacity=".18"/><path d="M12 3v2M10 20.5a2 2 0 0 0 4 0"/></svg> ごみ通知設定
                    </span>

                    <button type="button" id="notification-close" class="notification-close" aria-label="閉じる">
                        ×
                    </button>

                </div>


                <!-- ===========================
             タブ
        ============================ -->

                <div class="notification-tabs">

                    <button type="button" class="notification-tab active" data-tab="previous">
                        前日
                    </button>

                    <button type="button" class="notification-tab" data-tab="today">
                        当日
                    </button>

                </div>


                <!-- ===========================
             通知設定
        ============================ -->

                <div class="notification-settings">


                    <!-- 通知ON/OFF -->

                    <div class="notification-setting-row">

                        <span class="notification-setting-label">
                            通知
                        </span>


                        <label class="notification-switch">

                            <input type="checkbox" id="notification-enabled">

                            <span class="notification-slider"></span>

                        </label>

                    </div>


                    <!-- 時間 -->

                    <div class="notification-time-title">
                        通知時刻
                    </div>


                    <div class="notification-time-picker">


                        <!-- 時 -->

                        <div class="notification-time-column">

                            <div id="notification-hour-picker" class="notification-time-scroll">
                            </div>

                        </div>


                        <div class="notification-time-colon">
                            :
                        </div>


                        <!-- 分 -->

                        <div class="notification-time-column">

                            <div id="notification-minute-picker" class="notification-time-scroll">
                            </div>

                        </div>

                    </div>


                    <div class="notification-time-selected">

                        <span>
                            設定時刻：
                        </span>

                        <strong id="notification-selected-time">
                            07:00
                        </strong>

                    </div>


                </div>

            </div>

        </div>


        <!-- ===========================
             月移動
        ============================ -->

        <div class="month-navigation">

            <button type="button" id="previous-month">
                ← 前の月
            </button>


            <h2 id="month-title">
                読み込み中...
            </h2>


            <button type="button" id="next-month">
                次の月 →
            </button>

        </div>


        <!-- ===========================
             カレンダー
        ============================ -->

        <div class="calendar-card">


            <!-- 曜日 -->

            <div class="calendar-week">

                <div>
                    日
                </div>

                <div>
                    月
                </div>

                <div>
                    火
                </div>

                <div>
                    水
                </div>

                <div>
                    木
                </div>

                <div>
                    金
                </div>

                <div>
                    土
                </div>

            </div>


            <!-- 日付 -->

            <div id="calendar-days" class="calendar-days">
            </div>


        </div>

        <!-- ===========================
             カレンダーに追加した
             指定場所
        ============================ -->

        <section class="location-information">

            <h2>
                カレンダーに追加した指定場所
            </h2>


            <div id="calendar-location-list" class="calendar-location-list">
            </div>

        </section>


        <!-- ===========================
             ごみ情報
        ============================ -->

        <section class="garbage-information">

            <h2>
                ごみ情報
            </h2>


            <div id="garbage-list" class="garbage-list">
            </div>

        </section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/calendar.js"></script>


</body>

</html>
