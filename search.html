<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ながさきごみナビ
    </title>
    <link rel="icon" href="img/icon.ico">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/search.css"
    >
</head>

<body>

    <!-- ===========================
         ヘッダー
    ============================ -->

    <header class="header">

        <a href="main.html" class="header-logo">
            <img src="img/icon.ico" class="emoji-icon">ながさきごみナビ
        </a>

        
        <link rel="icon" href="img/icon.png">
        <link rel="apple-touch-icon" href="img/icon.png">
        <link rel="manifest" href="manifest.json">
        

        <div class="selected-city">

            <span id="city-name">
                読み込み中...
            </span>

            <span
                id="area-name"
                class="selected-area"
            ></span>

            <a href="index.html?change=true">
                変更
            </a>

        </div>

    </header>


    <!-- ===========================
         ナビゲーション
    ============================ -->

    <nav class="navigation">

        <a
            href="search.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="currentColor" fill-opacity=".18"/><path d="M15.5 15.5 20.5 20.5"/></svg></span>
            <span>検索</span>
        </a>

        <a
            href="calendar.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5V10h-17z" fill="currentColor" fill-opacity=".18" stroke="none"/><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.6"/></svg></span>
            <span>カレンダー</span>
        </a>

        <a
            href="location.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span>指定場所</span>
        </a>

        <a
            href="about.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity=".18"/><path d="M12 11v5.5"/><path d="M12 7.5h.01" stroke-width="2.6"/></svg></span>
            <span>概要</span>
        </a>

    </nav>


    <!-- ===========================
         メイン
    ============================ -->

    <main class="search-container">

        <h1>
            ごみを検索
        </h1>

        <p class="search-description">
            捨てたいごみの名前を入力するか、画像をアップロードしてください。
        </p>


        <!-- ===========================
             文字検索
        ============================ -->

        <section class="search-section">

            <h2>
                文字から検索
            </h2>

            <div class="search-box">

                <input
                    type="text"
                    id="search-input"
                    placeholder="例：ペットボトル"
                >

                <button
                    type="button"
                    id="search-button"
                >
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="currentColor" fill-opacity=".18"/><path d="M15.5 15.5 20.5 20.5"/></svg> 検索
                </button>

            </div>

        </section>


        <!-- ===========================
             画像検索
        ============================ -->

        <section class="image-search-section">

            <h2>
                画像から検索
            </h2>

            <p class="image-search-description">
                文字で検索しても見つからないごみや、名前が分からないごみは画像から判定できます。
            </p>


            <!-- ファイル選択 -->

            <div class="image-upload-area">

                <label
                    for="image-input"
                    class="image-upload-button"
                >
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5A1.5 1.5 0 0 1 5 7h2.6l1.5-2.2h5.8L16.4 7H19a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="13" r="3.5"/></svg> 画像を選択
                </label>

                <input
                    type="file"
                    id="image-input"
                    accept="image/*"
                >

            </div>


            <!-- 画像プレビュー -->

            <div
                id="image-preview-area"
                class="image-preview-area"
            >

                <p class="image-preview-message">
                    画像を選択するとここに表示されます。
                </p>

            </div>


            <!-- AI判定ボタン -->

            <button
                type="button"
                id="image-ai-button"
                class="image-ai-button"
                disabled
            >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="8" width="15" height="11.5" rx="3" fill="currentColor" fill-opacity=".18"/><path d="M12 8V5.5M2.5 12.5v3M21.5 12.5v3M10 16.5h4"/><path d="M12 4h.01M9.5 12.5h.01M14.5 12.5h.01" stroke-width="2.8"/></svg> AIで判定
            </button>

        </section>


        <!-- ===========================
             検索結果
        ============================ -->

        <section
            id="search-result"
            class="search-result"
        ></section>


        <!-- ===========================
             AI判定結果
        ============================ -->

        <section
            id="ai-result"
            class="ai-result"
        ></section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/search.js"></script>

</body>

</html>
