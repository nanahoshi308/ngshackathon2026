<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ながさきごみナビ</title>
    <link rel="icon" href="img/icon.ico">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/location.css"
    >

</head>

<body>

    <!-- ===========================
         ヘッダー
    ============================ -->

    <header class="header">

        <a href="main.html" class="header-logo">
            <img src="img/icon.ico" class="emoji-icon">ながさきごみナビ
        </a>

        <div class="selected-city">

            <span id="city-name">
                読み込み中...
            </span>

            <span
                id="area-name"
                class="selected-area"
            ></span>

            <a href="index.html?change=true">
                変更
            </a>

        </div>

    </header>


    <!-- ===========================
         ナビゲーション
    ============================ -->

    <nav class="navigation">

        <a
            href="search.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="currentColor" fill-opacity=".18"/><path d="M15.5 15.5 20.5 20.5"/></svg></span>
            <span>検索</span>
        </a>

        <a
            href="calendar.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5V10h-17z" fill="currentColor" fill-opacity=".18" stroke="none"/><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.6"/></svg></span>
            <span>カレンダー</span>
        </a>

        <a
            href="location.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span>指定場所</span>
        </a>

        <a
            href="about.html"
            class="nav-item"
        >
            <span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity=".18"/><path d="M12 11v5.5"/><path d="M12 7.5h.01" stroke-width="2.6"/></svg></span>
            <span>概要</span>
        </a>

    </nav>


    <!-- ===========================
         メイン
    ============================ -->

    <main class="location-container">

        <h1>
            拠点回収場所
        </h1>

        <p class="location-description">
            ごみの回収場所と回収日時を確認できます。
        </p>


        <!-- 市町村名 -->

        <section class="municipality-section">

            <h2 id="municipality-name">
                読み込み中...
            </h2>


            <!-- 自治会一覧 -->

            <div
                id="jichikai-list"
                class="jichikai-list"
            >
            </div>

        </section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/location.js"></script>

</body>

</html>
