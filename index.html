<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ながさきごみナビ</title>
    <link rel="icon" href="img/icon.ico">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">

</head>


<body>


    <!-- ========================================
         ヘッダー
    ======================================== -->

    <header class="header">

        <span class="header-logo">
            <img src="img/icon.ico" class="emoji-icon">ながさきごみナビ
        </span>

    </header>


    <!-- ========================================
         メイン
         1画面に1項目ずつ表示する
    ======================================== -->

    <main class="select-main">

        <section class="select-box">


            <!-- 戻る・進み具合 -->

            <div class="wizard-top">

                <button
                    id="back-button"
                    class="back-button"
                    type="button"
                    hidden
                >
                    ‹ 戻る
                </button>

                <ol
                    id="wizard-progress"
                    class="wizard-progress"
                    aria-label="設定の進み具合"
                ></ol>

            </div>


            <!-- ========================================
                 ステップ1：町名
            ======================================== -->

            <div
                id="step-town"
                class="wizard-step"
            >

                <h2 class="step-title">
                    お住まいの町名は？
                </h2>

                <p class="step-description">
                    長崎市・長与町の町名（長与町は自治会名）を入力してください。
                </p>


                <button
                    id="gps-button"
                    class="gps-button"
                    type="button"
                >
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="currentColor" fill-opacity=".18"/><circle cx="12" cy="10" r="2.5"/></svg>
                    <span id="gps-button-text">現在地から探す</span>
                </button>

                <p
                    id="gps-message"
                    class="gps-message"
                    hidden
                ></p>


                <!-- 現在地・前回の設定からの候補 -->

                <div
                    id="suggest-box"
                    class="suggest-box"
                    hidden
                >

                    <p
                        id="suggest-label"
                        class="suggest-label"
                    ></p>

                    <ul
                        id="suggest-list"
                        class="town-results"
                    ></ul>

                </div>


                <label
                    for="town-search"
                    class="visually-hidden"
                >
                    町名
                </label>

                <input
                    id="town-search"
                    class="town-search"
                    type="search"
                    placeholder="町名を入力（例：かき道、皆前）"
                    autocomplete="off"
                >

                <p
                    id="town-count"
                    class="town-count"
                ></p>

                <ul
                    id="town-results"
                    class="town-results"
                ></ul>

            </div>


            <!-- ========================================
                 ステップ2：ごみステーションの曜日
                 （ステーションによって曜日が異なる町のみ）
            ======================================== -->

            <div
                id="step-variant"
                class="wizard-step"
                hidden
            >

                <p
                    id="variant-town"
                    class="step-town"
                ></p>

                <h2
                    id="variant-title"
                    class="step-title"
                ></h2>

                <p class="step-description">
                    この町は、ごみステーションによって収集曜日が異なります。
                    いつも出しているごみステーションの曜日を選んでください。
                </p>

                <div
                    id="variant-options"
                    class="choice-list"
                ></div>

                <p class="step-note">
                    わからない場合は、ごみステーションの掲示や市のごみステーションマップでご確認ください。
                </p>

            </div>


            <!-- ========================================
                 ステップ3：確認
            ======================================== -->

            <div
                id="step-confirm"
                class="wizard-step"
                hidden
            >

                <p
                    id="confirm-town"
                    class="step-town"
                ></p>

                <h2 class="step-title">
                    この曜日で合っていますか？
                </h2>

                <ul
                    id="confirm-list"
                    class="confirm-list"
                ></ul>

                <div class="confirm-actions">

                    <button
                        id="start-button"
                        class="start-button"
                        type="button"
                    >
                        はい、これで始める
                    </button>

                    <button
                        id="fix-variant-button"
                        class="sub-button"
                        type="button"
                        hidden
                    >
                        曜日を選び直す
                    </button>

                    <button
                        id="fix-town-button"
                        class="sub-button"
                        type="button"
                    >
                        町名を選び直す
                    </button>

                </div>

                <p class="step-note">
                    ※ 選んだ地域はこの端末に保存されます。
                    あとから「変更」で選び直せます。
                </p>

            </div>


        </section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
