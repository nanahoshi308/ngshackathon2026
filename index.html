<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ながさきごみナビ</title>
    <link rel="icon" href="img/icon.ico">

    <link rel="stylesheet" href="css/index.css">

</head>


<body>


    <!-- ========================================
         ヘッダー
    ======================================== -->

    <header class="header">

        <div class="header-inner">

            <h1>
            <img src="img/icon.ico" class="emoji-icon">ながさきごみナビ
            </h1>

        </div>

    </header>


    <!-- ========================================
         メイン
    ======================================== -->

    <main class="select-main">

        <section class="select-box">


            <!-- ========================================
                 タイトル
            ======================================== -->

            <h2>
                お住まいの地域を選択
            </h2>


            <p class="select-description">

                市町村を選んでから、町名を入力して検索してください。

            </p>


            <!-- ========================================
                 市町村
            ======================================== -->

            <div class="select-group">

                <label for="municipality">
                    市町村
                </label>


                <select id="municipality">

                    <option value="">
                        市町村を選択してください
                    </option>

                </select>

            </div>


            <!-- ========================================
                 町名
            ======================================== -->

            <div
                id="town-group"
                class="select-group hidden"
            >

                <label for="town-search">
                    町名
                </label>


                <input
                    id="town-search"
                    class="town-search"
                    type="search"
                    placeholder="町名の一部を入力（例：かき道、皆前）"
                    autocomplete="off"
                >


                <p
                    id="town-count"
                    class="town-count"
                ></p>


                <ul
                    id="town-results"
                    class="town-results"
                ></ul>


                <!-- 選択した町 -->

                <div
                    id="selected-town"
                    class="selected-town hidden"
                >

                    <span class="selected-town-label">
                        選択中：
                    </span>

                    <strong id="selected-town-name"></strong>

                    <button
                        id="town-clear"
                        class="town-clear"
                        type="button"
                    >
                        選び直す
                    </button>

                </div>

            </div>


            <!-- ========================================
                 ごみステーションの選択
                 （ステーションによって曜日が異なる町のみ）
            ======================================== -->

            <div
                id="variant-group"
                class="variant-group hidden"
            >

                <h3 class="variant-title">
                    ごみステーションの収集曜日
                </h3>


                <p class="variant-description">

                    この町は、ごみステーションによって収集曜日が異なります。
                    いつも利用しているごみステーションの曜日を選んでください。
                    わからない場合は、ごみステーションの掲示や市のごみステーションマップでご確認ください。

                </p>


                <div id="variant-list"></div>

            </div>


            <!-- ========================================
                 ごみ情報を見る
            ======================================== -->

            <button
                id="start-button"
                class="start-button"
                disabled
            >

                ごみ情報を見る

            </button>


            <p class="select-note">

                ※ 選んだ地域はこの端末に保存されます。
                あとから「変更」で選び直せます。

            </p>


        </section>

    </main>


    <!-- ========================================
         フッター
    ======================================== -->

    <footer class="footer">
    </footer>


    <script src="js/data.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
